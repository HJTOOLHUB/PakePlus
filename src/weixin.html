<!DOCTYPE html>
<link rel="icon" href="https://img.cdn1.vip/i/69e48398936a9_1776583576.png" type="image/x-icon">
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加微信好友</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 微信官方绿色渐变主题 */
            background: linear-gradient(135deg, #07C160 0%, #06B058 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        /* 网格背景 */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 纯白卡片 */
        .glass-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
            max-width: 90%;
            width: 400px;
            color: #1a1a1a;
            position: relative;
            z-index: 1;
        }

        /* 二维码图片容器 */
        .qr-container {
            width: 100%;
            max-width: 280px;
            margin: 0 auto 1.5rem;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            padding: 1rem;
            border: 1px solid #e0e0e0;
        }

        .qr-code {
            width: 100%;
            display: block;
            border-radius: 4px;
        }

        /* 信息部分 */
        .nickname {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .location {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        /* 按钮样式 */
        .action-btn {
            background: #fff;
            border: 1px solid #d0d0d0;
            color: #1a1a1a;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0.5rem;
        }

        .action-btn:hover {
            background: #f5f5f5;
            border-color: #0078d4;
        }

        /* 微信绿色主按钮 */
        .copy-btn {
            background: #07C160;
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #06a050;
        }

        .tips {
            margin-top: 1.5rem;
            font-size: 14px;
            color: #666;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #fff;
            border: 1px solid #d0d0d0;
            color: #1a1a1a;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            background: #f5f5f5;
            border-color: #0078d4;
            color: #0078d4;
        }

        /* 复制成功提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 1.5rem;
            }
            .nickname {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 网格背景 -->
    <div class="grid-background"></div>

    <!-- 返回按钮 -->
    <button class="back-btn" id="backBtn" onclick="if(window.history.length > 1) { window.history.back(); } else { window.close(); }">返回</button>

    <div class="glass-card">
        <div class="qr-container">
            <img src="weixin.webp" alt="微信二维码" class="qr-code">
        </div>
        <h1 class="nickname">Hou</h1>
        <p class="location">扫码添加微信</p>
        
        <button class="action-btn copy-btn" id="copyBtn">复制微信号</button>
        <p class="tips">打开微信扫一扫即可添加</p>
    </div>

    <!-- 复制成功提示 -->
    <div class="toast" id="toast">复制成功！</div>

    <script>
        // 改成你的微信号
        const wechatId = "Hou776836";
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const backBtn = document.getElementById('backBtn');

        // 返回上一页
        backBtn.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // 如果没有历史记录，跳转到首页或上一级目录
                window.location.href = './';
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(wechatId);
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = wechatId;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }
        });
    </script>
</body>
</html>
